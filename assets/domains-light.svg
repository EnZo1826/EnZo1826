<text x="662" y="78" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="14" fill="#0B0F14" font-weight="700" letter-spacing="0.5">FULL-STACK DEVELOPMENT</text>
<line x1="662" y1="88" x2="916" y2="88" stroke="#D9E0E7" stroke-width="1"/>
<text x="662" y="108" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#4B5768">Mobile-first, offline-first web</text>
<text x="662" y="124" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#4B5768">applications and the services behind</text>
<text x="662" y="140" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#4B5768">them: local transaction queues, API</text>
<text x="662" y="156" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#4B5768">synchronisation, audit logging, exports</text>
<rect x="954" y="24" width="290" height="170" fill="#FFFFFF" rx="6" stroke="#D9E0E7" stroke-width="1"/>
<circle class="led" cx="976" cy="48" r="5" fill="#107A62"/>
