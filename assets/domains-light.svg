<svg xmlns="http://www.w3.org/2000/svg" width="1268" height="408" viewBox="0 0 1268 408" role="img" aria-label="Eight engineering domains: Industrial Automation, IoT and Edge Computing, Full-Stack Development, AI and Agent Systems, Cloud Infrastructure, Security Technology, GPS and Telematics, Real-Time Visualization">
