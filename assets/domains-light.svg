<text x="42" y="78" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="14" fill="#0B0F14" font-weight="700" letter-spacing="0.5">INDUSTRIAL AUTOMATION</text>
<line x1="42" y1="88" x2="296" y2="88" stroke="#D9E0E7" stroke-width="1"/>
<text x="42" y="108" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#4B5768">PLC-based control and monitoring treated</text>
<text x="42" y="124" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#4B5768">as a first-class engineering discipline:</text>
<text x="42" y="140" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#4B5768">digital and analog I/O, pulse counting,</text>
<text x="42" y="156" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#4B5768">Modbus registers, timers, alarms and</text>
