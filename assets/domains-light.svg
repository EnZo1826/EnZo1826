<text x="352" y="78" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="14" fill="#0B0F14" font-weight="700" letter-spacing="0.5">IOT AND EDGE COMPUTING</text>
<line x1="352" y1="88" x2="606" y2="88" stroke="#D9E0E7" stroke-width="1"/>
<text x="352" y="108" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#4B5768">Edge devices that keep working through</text>
<text x="352" y="124" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#4B5768">connectivity loss: local logic,</text>
<text x="352" y="140" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#4B5768">buffering, MQTT messaging and controlled</text>
<text x="352" y="156" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#4B5768">edge-to-cloud transfer over Ethernet,</text>
<rect x="644" y="24" width="290" height="170" fill="#FFFFFF" rx="6" stroke="#D9E0E7" stroke-width="1"/>
<circle class="led" cx="666" cy="48" r="5" fill="#107A62"/>
