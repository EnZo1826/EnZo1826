<line x1="972" y1="88" x2="1226" y2="88" stroke="#D9E0E7" stroke-width="1"/>
<text x="972" y="108" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#4B5768">Practical AI in engineering work:</text>
<text x="972" y="124" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#4B5768">multi-agent development workflows with</text>
<text x="972" y="140" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#4B5768">defined roles and approval gates, local</text>
<text x="972" y="156" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#4B5768">LLM experiments, tool calling and</text>
<rect x="24" y="214" width="290" height="170" fill="#FFFFFF" rx="6" stroke="#D9E0E7" stroke-width="1"/>
<circle class="led" cx="46" cy="238" r="5" fill="#107A62"/>
<text x="60" y="243" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="12" fill="#107A62" font-weight="700" letter-spacing="2">CLOUD</text>
<text x="42" y="268" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="14" fill="#0B0F14" font-weight="700" letter-spacing="0.5">CLOUD INFRASTRUCTURE</text>
<line x1="42" y1="278" x2="296" y2="278" stroke="#D9E0E7" stroke-width="1"/>
<text x="42" y="298" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#4B5768">Hosting and operating the services that</text>
<text x="42" y="314" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#4B5768">field systems report to: Linux servers,</text>
<text x="42" y="330" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#4B5768">reverse proxies, TLS, DNS, containers</text>
<text x="42" y="346" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#4B5768">and service management.</text>
<rect x="334" y="214" width="290" height="170" fill="#FFFFFF" rx="6" stroke="#D9E0E7" stroke-width="1"/>
<circle class="led" cx="356" cy="238" r="5" fill="#107A62"/>
<text x="370" y="243" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="12" fill="#107A62" font-weight="700" letter-spacing="2">SEC</text>
<text x="352" y="268" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="14" fill="#0B0F14" font-weight="700" letter-spacing="0.5">SECURITY TECHNOLOGY</text>
<line x1="352" y1="278" x2="606" y2="278" stroke="#D9E0E7" stroke-width="1"/>
<text x="352" y="298" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#4B5768">Software integration for physical</text>
<text x="352" y="314" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#4B5768">security operations: checkpoint and</text>
<text x="352" y="330" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#4B5768">visitor workflows, IP cameras, vehicle</text>
<text x="352" y="346" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#4B5768">recognition and event notifications.</text>
<rect x="644" y="214" width="290" height="170" fill="#FFFFFF" rx="6" stroke="#D9E0E7" stroke-width="1"/>
<circle class="led" cx="666" cy="238" r="5" fill="#107A62"/>
<text x="680" y="243" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="12" fill="#107A62" font-weight="700" letter-spacing="2">GPS</text>
<text x="662" y="268" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="14" fill="#0B0F14" font-weight="700" letter-spacing="0.5">GPS AND TELEMATICS</text>
<line x1="662" y1="278" x2="916" y2="278" stroke="#D9E0E7" stroke-width="1"/>
<text x="662" y="298" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#4B5768">Turning vehicle telemetry into</text>
<text x="662" y="314" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#4B5768">operational intelligence for transport,</text>
<text x="662" y="330" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#4B5768">security and logistics: live position,</text>
<text x="662" y="346" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#4B5768">trips, geofences, driver behaviour and</text>
<rect x="954" y="214" width="290" height="170" fill="#FFFFFF" rx="6" stroke="#D9E0E7" stroke-width="1"/>
<circle class="led" cx="976" cy="238" r="5" fill="#107A62"/>
<text x="990" y="243" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="12" fill="#107A62" font-weight="700" letter-spacing="2">VIZ</text>
<text x="972" y="268" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="14" fill="#0B0F14" font-weight="700" letter-spacing="0.5">REAL-TIME VISUALIZATION</text>
<line x1="972" y1="278" x2="1226" y2="278" stroke="#D9E0E7" stroke-width="1"/>
<text x="972" y="298" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#4B5768">Interfaces that turn telemetry into</text>
<text x="972" y="314" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#4B5768">decisions: Grafana and custom</text>
<text x="972" y="330" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#4B5768">dashboards, alarm feeds, historical</text>
<text x="972" y="346" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#4B5768">trends and physical LED displays driven</text>
