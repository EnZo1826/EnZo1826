<svg xmlns="http://www.w3.org/2000/svg" width="900" height="40" viewBox="0 0 900 40" role="img" aria-label="Typing line cycling through tool chain and project categories">
<style>
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
}
</style>
<rect width="900" height="40" fill="transparent"/>
<g>
    <text x="0" y="26" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="18" fill="#1E9E5C" opacity="0">PLC -> Pi -> MQTT -> Postgres -> PWA
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0;0.008;0.283;0.317;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="0" y="26" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="18" fill="#1E9E5C" opacity="0">Fleet tracking . Weighbridges . Digital signage
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.333;0.342;0.617;0.65;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="0" y="26" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="18" fill="#1E9E5C" opacity="0">Offline-first apps for real sites
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.667;0.675;0.95;0.983;1" dur="12s" repeatCount="indefinite"/>
    </text></g>
<rect x="0" y="6" width="2" height="22" fill="#0E7C91">
  <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
</rect>
</svg>