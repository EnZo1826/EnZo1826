<svg xmlns="http://www.w3.org/2000/svg" width="900" height="44" viewBox="0 0 900 44" role="img" aria-label="Terminal line cycling through the core engineering message">
<style>@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }@keyframes line-cycle { 0% { opacity: 1; } 27.3% { opacity: 1; } 32.3% { opacity: 0; } 99.0% { opacity: 0; } 100% { opacity: 1; } }
.line0 { opacity: 1; animation: line-cycle 12s linear infinite; animation-delay: 0.00s; }
.line1 { opacity: 0; animation: line-cycle 12s linear infinite; animation-delay: -4.00s; }
.line2 { opacity: 0; animation: line-cycle 12s linear infinite; animation-delay: -8.00s; }
.cursor { animation: blink 1s ease-in-out infinite; } @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }</style>
<rect x="0" y="0" width="900" height="44" fill="transparent"/>
<text class="line0" x="0" y="28" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="18" fill="#49D7B1">I engineer intelligent systems end to end: hardware to cloud.</text>
<text class="line1" x="0" y="28" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="18" fill="#49D7B1">Edge devices that keep working when the uplink does not.</text>
<text class="line2" x="0" y="28" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="18" fill="#49D7B1">Practical AI where it measurably helps the work.</text>
<rect class="cursor" x="0" y="6" width="2" height="24" fill="#DA3633"/>
</svg>