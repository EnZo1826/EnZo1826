<svg xmlns="http://www.w3.org/2000/svg" width="600" height="436" viewBox="0 0 600 436" role="img" aria-label="E: Intelligent LED matrix control — Microcontroller-driven HUB75 RGB LED matrices that display live process values, text and alarm states commanded over MQTT."><style>
@keyframes trace-flow { to { stroke-dashoffset: -40; } }
@keyframes node-pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
@keyframes led-blink { 0%,70%,100% { opacity: 1; } 80% { opacity: .25; } }
@keyframes ring-ping { 0% { transform: scale(.6); opacity: .8; } 100% { transform: scale(2.6); opacity: 0; } }
@keyframes bar-rise { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
@keyframes spin-slow { to { transform: rotate(360deg); } }
@keyframes float-y { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes scan-x { 0% { transform: translateX(-120px); opacity: 0; } 10%,90% { opacity: 1; } 100% { transform: translateX(1320px); opacity: 0; } }
@keyframes caret { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
.animate-trace { stroke-dasharray: 4 6; animation: trace-flow 1.6s linear infinite; }
.animate-trace-slow { stroke-dasharray: 2 8; animation: trace-flow 3.2s linear infinite; }
.animate-node-pulse { animation: node-pulse 2.4s ease-in-out infinite; }
.animate-led { animation: led-blink 2.4s steps(1, end) infinite; }
.animate-ping-ring { transform-box: fill-box; transform-origin: center; animation: ring-ping 2.4s cubic-bezier(.16,1,.3,1) infinite; }
.animate-bar { transform-box: fill-box; transform-origin: bottom; animation: bar-rise 2.4s cubic-bezier(.45,0,.55,1) infinite; }
.animate-spin-slow { transform-box: fill-box; transform-origin: center; animation: spin-slow 30s linear infinite; }
.animate-float { animation: float-y 6s ease-in-out infinite; }
.scan { animation: scan-x 7s linear infinite; }
.caret { animation: caret 1s steps(1, end) infinite; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; }
  .animate-ping-ring, .scan { opacity: 0; }
}</style><defs><clipPath id="card-clip"><rect x="0" y="0" width="600" height="436" rx="14"></rect></clipPath><clipPath id="banner-clip"><rect x="1" y="1" width="598" height="230"></rect></clipPath><linearGradient id="banner-fade" x1="0" x2="0" y1="0" y2="1"><stop offset="0.7" stop-color="#F6F8FA" stop-opacity="0"></stop><stop offset="1" stop-color="#F6F8FA" stop-opacity="1"></stop></linearGradient></defs><g clip-path="url(#card-clip)"><rect width="600" height="436" fill="#F6F8FA"></rect><g clip-path="url(#banner-clip)"><svg x="0" y="0" width="600" height="230" viewBox="0 0 320 140" preserveAspectRatio="xMidYMid slice"><svg viewBox="0 0 320 140" preserveAspectRatio="xMidYMid slice"><rect width="320" height="140" fill="#FFFFFF"></rect><defs><pattern id="led-dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#D9E0E7"></circle></pattern></defs><rect width="100%" height="100%" fill="url(#led-dots)" opacity="0.7"></rect><defs><pattern id="ledm-dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1.7" fill="#fff"></circle></pattern><mask id="led-mask"><rect x="30" y="30" width="260" height="60" fill="url(#ledm-dots)"></rect></mask></defs><rect x="24" y="24" width="272" height="72" rx="5" fill="#0B0F14" stroke="#C3CCD5"></rect><rect x="30" y="30" width="260" height="60" fill="url(#ledm-dots)" opacity="0.08"></rect><g mask="url(#led-mask)"><g><text x="36" y="74" fill="#DA3633" font-family="JetBrains Mono, monospace" font-weight="700" font-size="38" letter-spacing="2">BAY 2 · PROCEED</text><text x="386" y="74" fill="#107A62" font-family="JetBrains Mono, monospace" font-weight="700" font-size="38" letter-spacing="2">HUB75 · MQTT</text><animateTransform attributeName="transform" type="translate" values="0 0;-350 0" dur="8s" repeatCount="indefinite"></animateTransform></g></g><rect x="110" y="104" width="100" height="20" rx="4" fill="#F6F8FA" stroke="#D9E0E7"></rect><text x="160" y="117" fill="#107A62" 