<svg xmlns="http://www.w3.org/2000/svg" width="600" height="436" viewBox="0 0 600 436" role="img" aria-label="A: Industrial fuel management system — A fuel dispensing and transaction-management architecture that turns pulses from a flow meter into vehicle-linked transactions, printed receipts and ERP records."><style>
@keyframes trace-flow { to { stroke-dashoffset: -40; } }
@keyframes node-pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
@keyframes led-blink { 0%,70%,100% { opacity: 1; } 80% { opacity: .25; } }
@keyframes ring-ping { 0% { transform: scale(.6); opacity: .8; } 100% { transform: scale(2.6); opacity: 0; } }
@keyframes bar-rise { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
@keyframes spin-slow { to { transform: rotate(360deg); } }
@keyframes float-y { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes scan-x { 0% { transform: translateX(-120px); opacity: 0; } 10%,90% { opacity: 1; } 100% { transform: translateX(1320px); opacity: 0; } }
@keyframes caret { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
.animate-trace { stroke-dasharray: 4 6; animation: trace-flow 1.6s linear infinite; }
.animate-trace-slow { stroke-dasharray: 2 8; animation: trace-flow 3.2s linear infinite; }
.animate-node-pulse { animation: node-pulse 2.4s ease-in-out infinite; }
.animate-led { animation: led-blink 2.4s steps(1, end) infinite; }
.animate-ping-ring { transform-box: fill-box; transform-origin: center; animation: ring-ping 2.4s cubic-bezier(.16,1,.3,1) infinite; }
.animate-bar { transform-box: fill-box; transform-origin: bottom; animation: bar-rise 2.4s cubic-bezier(.45,0,.55,1) infinite; }
.animate-spin-slow { transform-box: fill-box; transform-origin: center; animation: spin-slow 30s linear infinite; }
.animate-float { animation: float-y 6s ease-in-out infinite; }
.scan { animation: scan-x 7s linear infinite; }
.caret { animation: caret 1s steps(1, end) infinite; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; }
  .animate-ping-ring, .scan { opacity: 0; }
}</style><defs><clipPath id="card-clip"><rect x="0" y="0" width="600" height="436" rx="14"></rect></clipPath><clipPath id="banner-clip"><rect x="1" y="1" width="598" height="230"></rect></clipPath><linearGradient id="banner-fade" x1="0" x2="0" y1="0" y2="1"><stop offset="0.7" stop-color="#11161D" stop-opacity="0"></stop><stop offset="1" stop-color="#11161D" stop-opacity="1"></stop></linearGradient></defs><g clip-path="url(#card-clip)"><rect width="600" height="436" fill="#11161D"></rect><g clip-path="url(#banner-clip)"><svg x="0" y="0" width="600" height="230" viewBox="0 0 320 140" preserveAspectRatio="xMidYMid slice"><svg viewBox="0 0 320 140" preserveAspectRatio="xMidYMid slice"><rect width="320" height="140" fill="#05070A"></rect><defs><pattern id="fuel-dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#1F2A36"></circle></pattern></defs><rect width="100%" height="100%" fill="url(#fuel-dots)" opacity="0.7"></rect><rect x="22" y="30" width="40" height="84" rx="5" fill="#11161D" stroke="#2B3A4A"></rect><rect x="28" y="38" width="28" height="16" rx="2" fill="#05070A" stroke="#1F2A36"></rect><text x="42" y="49" fill="#49D7B1" font-family="JetBrains Mono, monospace" font-size="7" letter-spacing="1" text-anchor="middle">L</text><rect x="28" y="60" width="28" height="46" rx="2" fill="#05070A" stroke="#1F2A36"></rect><rect x="30" y="62" width="24" height="42" rx="1" fill="#49D7B1" opacity="0.18"></rect><rect x="30" y="84" width="24" height="20" rx="1" fill="#49D7B1" opacity="0.75"><animate attributeName="y" values="104;64;104" dur="6s" repeatCount="indefinite"></animate><animate attributeName="height" values="0;40;0" dur="6s" repeatCount="indefinite"></animate></rect><path d="M62 44 h8 a6 6 0 0 1 6 6 v6" fill="none" stroke="#2B3A4A" stroke-width="3" stroke-linecap="round"></path><path d="M70 70 h8 v-10 h8 v10 h8 v-10 h8 v10 h8 v-10 h8 v10 h8" fill="none" stroke="#49D7B1" stroke-opacity="0.35" stroke-width="1.4"></path><path d="