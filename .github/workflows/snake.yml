# Daily contribution snake, published to the `output` branch.
# README reads github-snake-dark.svg / github-snake-light.svg from that branch.
# Colours from tokens.json: crimson snake; dots run line -> teal (dark set) and
# line -> light-mode teal #107A62 (light set).
name: snake

on:
  schedule:
    - cron: "41 3 * * *" # 05:41 Africa/Windhoek
  workflow_dispatch:
  push: # TEMPORARY branch test trigger, remove before hand-off
    branches: [feat/jakes9na-rebrand]

permissions: {}

concurrency:
  group: snake
  cancel-in-progress: false

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push to the output branch
    steps:
      - uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ github.token }}
          outputs: |
            dist/github-snake-light.svg?palette=github-light&color_snake=#DA3633&color_dots=#D9E0E7,#C3DED8,#88BCB0,#4C9B89,#107A62
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#DA3633&color_dots=#1F2A36,#225049,#30806E,#3EB093,#49D7B1

      - uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: ${{ github.event_name == 'push' && 'snake-preview' || 'output' }} # TEMPORARY
          build_dir: dist
          keep_history: true # append commits; never force-push the branch
          jekyll: false
          commit_message: "chore: update snake [skip ci]"
        env:
          GITHUB_TOKEN: ${{ github.token }}
